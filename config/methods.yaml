# Paramètres des méthodes de placement. Modifiable sans toucher au code.
axes:
  x: { label: Exploitation, hint: "plus à droite = revenus tirés du capital plutôt que du travail" }
  y: { label: Domination, hint: "plus haut = position dominante (capital culturel / diplôme)" }
  range: [-10, 10]

methods:
  read_positions:
    description: "Réplique : les 41 catégories sont placées là où le graphique de Chris les affiche (lecture de ses vidéos, grille de 0,5). Les électorats en sont les barycentres."
    merge_groups: { "2": ["1", "2"] }  # les sondages n'isolent pas les agriculteurs
  ranks:
    description: "Calculée sur données ouvertes : rangs 1..N normalisés sur [-10,10]. Elle s'écarte du graphique de Chris, notamment pour les retraités."
    x_score: patrimoine_over_niveau_vie      # score = patrimoine / niveau_vie
    y_weights: { bac5: 5, bac3: 3, bac2: 2, bac: 1, cap: -1, brevet: -2, certif_aucun: -3 }
    retired_y_override: { code: "7", score: -180 }  # équivaut à 180 % de CAP dans la référence
    candidate_pcs_level: 1
  continuous:
    description: "Valeurs continues standardisées (z-scores) puis remises à l'échelle [-10,10]"
    x_score: patrimoine_over_niveau_vie
    y_weights: { bac5: 5, bac3: 3, bac2: 2, bac: 1, cap: -1, brevet: -2, certif_aucun: -3 }
    retired_y_override: null
    candidate_pcs_level: 1
  mca:
    description: "Analyse des correspondances multiples sur variables patrimoine/revenu/diplôme"
    n_components: 2
    candidate_pcs_level: 1
  espace_social:
    description: "D'après Bourdieu (La Distinction, 1979) : en hauteur le volume du capital, en largeur sa structure, du culturel à gauche à l'économique à droite. Capital économique : patrimoine et niveau de vie, en logarithme ; capital culturel : diplômes, pondérés par la durée théorique des études. Ce n'est pas une reconstruction du graphique de Chris. Le volume porte l'essentiel des écarts : l'axe horizontal est étiré par la mise à l'échelle. Les retraités restent placés selon leurs propres diplômes, qui reflètent leur génération : leur position à droite est en partie un effet d'âge."
    axes:
      x: { label: Structure du capital, hint: "plus à droite = capital surtout économique, plus à gauche = capital surtout culturel", low: capital culturel, high: capital économique }
      y: { label: Volume du capital, hint: "plus haut = plus de capital, économique et culturel réunis", low: moins de capital, high: plus de capital }
    y_weights: { bac5: 5, bac3: 3.5, bac2: 2, bac: 0, cap: -1, brevet: -3, certif_aucun: -4 }  # années d'études par rapport au bac
    retired_y_override: null
    candidate_pcs_level: 1
