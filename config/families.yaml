# Familles politiques et blocs : ce qui relie les électorats d'une élection à l'autre.
#
# C'est une simplification, à lire comme telle :
# - une famille réunit des candidats et des listes qui ne se confondent pas (Hamon 2017 était aussi
#   soutenu par EELV, Mélenchon 2017 par le PCF, Mélenchon 2012 par le Front de gauche) ;
# - une famille suit une lignée, malgré les changements de nom et de parti : le RPR, l'UMP et Les
#   Républicains ; le FN et le RN ; l'UDF et le MoDem ; les Verts et EELV. Marine Le Pen succède à
#   Jean-Marie Le Pen dans la même famille, Bayrou passe de l'UDF au MoDem ;
# - une famille n'a qu'un électorat par élection : en 1995, Chirac porte la lignée du RPR, et Balladur,
#   lui aussi du RPR et soutenu par l'UDF, n'appartient à aucune famille ; l'UDF n'a pas de candidat
#   cette année-là et le centre n'y a donc pas de point ;
# - les coalitions Front de gauche (européennes 2014), NUPES (2022) et NFP (2024) ne sont attribuées à
#   aucun parti : elles apparaissent comme des trous dans les trajectoires, et comptent dans le bloc
#   de gauche. La liste MoDem et UDI de 2014 est rattachée à la lignée du MoDem, sans l'UDI ;
# - le classement dans un bloc est un choix de ce projet, pas une donnée des sondages. Il range les
#   candidats d'une époque avec les catégories d'aujourd'hui : Chevènement à gauche, Bayrou au centre,
#   de Villiers avec Dupont-Aignan à l'extrême droite, Saint-Josse et Nihous (CPNT) hors bloc.
#
# Une famille n'a de point que là où le sondage donne une composition : un candidat sous 1 % dans
# un tableau en entiers, ou une abstention sans détail par groupe, n'en a pas (voir
# pipeline/sources/sondages.py).
#
# projection: true : la famille entre dans le test sur le passé et la projection 2027
# (scripts/analyze/projection.py). Les autres n'ont qu'une trajectoire.

# Date approximative de chaque scrutin, en années décimales : l'échelle de temps des trajectoires.
