# Familles politiques et blocs : ce qui relie les électorats d'une élection à l'autre.
#
# C'est une simplification, à lire comme telle :
# - une famille réunit des candidats et des listes qui ne se confondent pas (Hamon 2017 était aussi
#   soutenu par EELV, Mélenchon 2017 par le PCF) ;
# - les coalitions NUPES (2022) et NFP (2024) ne sont attribuées à aucun parti : elles apparaissent
#   comme des trous dans les trajectoires, et comptent dans le bloc de gauche ;
# - le classement dans un bloc est un choix de ce projet, pas une donnée des sondages.
#
# projection: true : la famille entre dans le test sur le passé et la projection 2027
# (scripts/analyze/projection.py). Les autres n'ont qu'une trajectoire.

# Date approximative de chaque scrutin, en années décimales : l'échelle de temps des trajectoires.
dates:
  2017_presidentielle_t1: 2017.31
  2017_legislatives_t1: 2017.44
  2019_europeennes: 2019.40
  2022_presidentielle_t1: 2022.28
  2022_legislatives_t1: 2022.44
  2024_europeennes: 2024.44
  2024_legislatives_t1: 2024.50

