# Vérifications : lint, tests, validation des contrats, build web.
# Les actions sont épinglées par SHA (versions publiées depuis plus de 2 semaines) ; Dependabot les met à jour.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff, pytest, schémas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run python scripts/validate.py

  web:
    name: Web (eslint, vitest, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: detect
        name: Présence de web/
        run: |
          if [ -f web/package.json ] && [ -f web/pnpm-lock.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::web/ absent ou sans pnpm-lock.yaml : job web ignoré"
          fi
      - if: steps.detect.outputs.present == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - if: steps.detect.outputs.present == 'true'
        working-directory: web
        run: pnpm install --frozen-lockfile
      - if: steps.detect.outputs.present == 'true'
        working-directory: web
        run: pnpm lint
      - if: steps.detect.outputs.present == 'true'
        working-directory: web
        run: pnpm test
      - if: steps.detect.outputs.present == 'true'
        working-directory: web
        run: pnpm build
